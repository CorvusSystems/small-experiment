<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090911"><title>Un pequeño experimento ✦</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080910;color:#f7f0f4;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}main{position:relative;z-index:2;display:flex;min-height:100dvh;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}.panel{max-width:650px;width:100%;transition:opacity .7s,transform .7s;pointer-events:auto}.eyebrow{color:#db91ac;letter-spacing:.23em;font-size:11px;text-transform:uppercase;font-weight:700}.title{font-weight:500;letter-spacing:-.035em;font-size:clamp(30px,6vw,56px);margin:16px 0}.sub{color:#b6afbf;line-height:1.7;font-size:clamp(14px,2.4vw,17px);min-height:25px}.btn{border:1px solid #8c556f;background:linear-gradient(135deg,#542c45,#2b1c33);color:#fff;border-radius:100px;padding:14px 29px;margin-top:25px;cursor:pointer;font-size:15px;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 0 25px #db719040}.hidden{opacity:0;transform:translateY(12px);pointer-events:none;position:absolute;left:0;right:0}.show{opacity:1;transform:none;pointer-events:auto;position:relative}.stage{display:none}.stage.on{display:block}.message{font-size:clamp(20px,4.3vw,36px);line-height:1.5;font-weight:400;letter-spacing:-.025em;max-width:590px;margin:0 auto;transition:opacity .65s}.name{font-family:Georgia,serif;font-size:clamp(52px,12vw,100px);font-style:italic;letter-spacing:-.055em;color:#f3c0d1;text-shadow:0 0 38px #d95c8666;margin:0 0 15px}.small{color:#d5c4ce;font-size:16px;line-height:1.6}.tip{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:#a78e9f;font-size:12px;z-index:3;pointer-events:none;opacity:0;transition:opacity 1s}.tip.visible{opacity:1}.spark{color:#f4aac7}.fade{animation:rise 1.2s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style></head><body><canvas id="sky" aria-hidden="true"></canvas><main><section id="intro" class="panel fade"><div class="eyebrow">un pequeño experimento · 01</div><h1 class="title">Te dije que te mostraría cómo se hace.</h1><p class="sub">Así que preparé una versión un poco diferente.</p><button class="btn" id="start">¿Quieres verlo? ✦</button></section><section id="experience" class="panel stage" aria-live="polite"><div id="line" class="message"></div></section><section id="ending" class="panel stage" aria-live="polite"><div class="eyebrow fade">experimento completado ✦</div><h2 class="name fade">Andrea</h2><p class="small fade">Espero que te haya gustado :)</p><button class="btn" id="again">Volver a verlo ↻</button></section></main><div class="tip" id="tip">Mueve el cursor o toca las partículas ✧</div>
<script>
(()=>{'use strict';const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1,particles=[],stars=[],phase='idle',started=0,raf=0,hoverAt=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let pointer={x:-999,y:-999,active:false};const rnd=(a,b)=>a+Math.random()*(b-a);function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.min(145,Math.floor(W*H/6500))},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.35,1.25),a:rnd(.12,.6),tw:rnd(0,7)}));if(phase==='heart')createHeart()}function heartPoint(t){let x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);let scale=Math.min(W/43,H/39,17);return{x:W/2+x*scale,y:H*.49-y*scale}}function createHeart(){const n=Math.min(850,Math.max(280,Math.floor(W*H/1200)));particles=Array.from({length:n},(_,i)=>{let t=Math.random()*Math.PI*2;let r=Math.sqrt(Math.random());let p=heartPoint(t);return{x:rnd(0,W),y:rnd(0,H),tx:W/2+(p.x-W/2)*r,ty:H*.49+(p.y-H*.49)*r,sz:rnd(.7,2.2),a:rnd(.55,1),seed:rnd(0,10),hue:rnd(335,358),delay:rnd(0,.55)}})}function render(ms){const sec=ms/1000;ctx.clearRect(0,0,W,H);const bg=ctx.createRadialGradient(W/2,H*.46,10,W/2,H*.46,Math.max(W,H)*.75);bg.addColorStop(0,'#19101d');bg.addColorStop(1,'#080910');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a*(.82+.18*Math.sin(sec*1.5+s.tw));ctx.fillStyle='#f2dce9';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;if(phase==='heart'){const elapsed=(ms-started)/1000;const settle=reduce?1:Math.min(1,Math.max(0,elapsed/3));for(const p of particles){const ease=Math.pow(Math.min(1,Math.max(0,(settle-p.delay)/(1-p.delay))),2);const x=p.x+(p.tx-p.x)*ease+Math.sin(sec*1.1+p.seed)*1.7*ease,y=p.y+(p.ty-p.y)*ease+Math.cos(sec*1.3+p.seed)*1.7*ease;let pushX=0,pushY=0;if(pointer.active){const dx=x-pointer.x,dy=y-pointer.y,d=Math.hypot(dx,dy);if(d<100&&d>0){const f=(1-d/100)*23;pushX=dx/d*f;pushY=dy/d*f}}ctx.globalAlpha=p.a*(.75+.25*Math.sin(sec*2+p.seed));ctx.fillStyle=`hsl(${p.hue} 86% ${rndStable(p.seed)}%)`;ctx.shadowBlur=10;ctx.shadowColor='#d84a7d';ctx.beginPath();ctx.arc(x+pushX,y+pushY,p.sz,0,7);ctx.fill()}ctx.shadowBlur=0;ctx.globalAlpha=1}raf=requestAnimationFrame(render)}function rndStable(seed){return 67+Math.sin(seed*3)*12}const wait=ms=>new Promise(r=>setTimeout(r,ms));const line=document.getElementById('line'),intro=document.getElementById('intro'),experience=document.getElementById('experience'),ending=document.getElementById('ending'),tip=document.getElementById('tip');let run=0;async function play(){const id=++run;intro.style.display='none';ending.classList.remove('on');experience.classList.add('on');line.style.opacity='1';line.textContent='Ejecutando un pequeño experimento...';phase='idle';tip.classList.remove('visible');await wait(1600);if(id!==run)return;line.style.opacity='0';await wait(700);if(id!==run)return;line.textContent='';phase='heart';createHeart();started=performance.now();tip.classList.add('visible');await wait(4700);if(id!==run)return;tip.classList.remove('visible');phase='idle';line.style.opacity='1';line.textContent='Originalmente solo iba a mostrarte cómo se hacía...';await wait(3000);if(id!==run)return;line.style.opacity='0';await wait(650);if(id!==run)return;line.textContent='Pero pensé que contigo podía hacerlo un poquito más especial.';line.style.opacity='1';await wait(3500);if(id!==run)return;line.style.opacity='0';await wait(700);if(id!==run)return;experience.classList.remove('on');ending.classList.add('on');phase='heart';createHeart();started=performance.now()-5000}document.getElementById('start').addEventListener('click',play);document.getElementById('again').addEventListener('click',play);addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY,active:true};hoverAt=Date.now()});addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY,active:true};hoverAt=Date.now()});addEventListener('pointerup',()=>pointer.active=false);addEventListener('pointerleave',()=>pointer.active=false);setInterval(()=>{if(Date.now()-hoverAt>1400)pointer.active=false},900);addEventListener('resize',resize);resize();raf=requestAnimationFrame(render)})();
</script></body></html>
